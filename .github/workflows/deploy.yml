name: Deploy Backend to Oracle VM

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Build (Native AMD64)
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: |
          npm install
          npx prisma generate
          npm run build

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU para ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/blimabru/conquistaserv-backend:main
            
            CONTAINER_ID=$(docker ps -q -f name=conquistaserv_backend)
            if [ ! -z "$CONTAINER_ID" ]; then
              docker stop $CONTAINER_ID
              docker rm $CONTAINER_ID
            fi
            
            docker run -d \
              --name conquistaserv_backend \
              --restart unless-stopped \
              -v /etc/localtime:/etc/localtime:ro \
              -v /etc/timezone:/etc/timezone:ro \
              -e TZ=America/Bahia \
              -e NODE_ENV=production \
              -e DATABASE_URL="postgresql://user_conquistaserv:ConquistaServDB97987989799*@postgres:5432/conquistaserv?schema=conquistaserv" \
              -e ACCESS_TOKEN_SECRET="3PT82qfufWNZgFpLiRtTBqdBB2JJIEt/YKec/AowZSo=" \
              -e ACCESS_TOKEN_EXPIRATION="86400s" \
              -e REFRESH_TOKEN_SECRET="3PT82qfufWNZgFpLiRtTBqdBB2JJIEt/YKec/AowZSo=" \
              -e REFRESH_TOKEN_EXPIRATION="604800s" \
              -e HTTP_PORT=3006 \
              -e APP_HOSTNAME="conquistaserv.brainstormlabs.online" \
              -e APP_NAME="conquistaserv-backend" \
              --network global-network \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ghcr.io/blimabru/conquistaserv-backend:main
              
            docker image prune -af